# โครงสร้างพื้นฐานสำหรับข้อสอบปลายภาค ส่วนที่ 2
# ใช้: docker compose up -d แล้วคัดลอก .env.example เป็น .env
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: exam_db
    ports:
      - "3309:3306"
    command: --default-authentication-plugin=caching_sha2_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
